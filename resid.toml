[package]
name = "resid-json"
version = "0.1.0"
root = "src/json.resid"

# The package is pure: no capabilities. The tests only print.
[capabilities]
grant = []

# The framework this is a format for. src/*.resid import it by package
# name (`import "resid-serial/serial.resid";`), which this entry resolves:
# the depmap names its root, and its other modules sit beside that root.
#
# `path` is the working copy beside this checkout; `version` is what a
# build takes from the registry where that path is not there (a published
# copy of this package). The framework's source is at
# https://github.com/larrydewey/resid-serial.
[dependencies.resid-serial]
path = "../resid-serial"
version = "0.1.0"
